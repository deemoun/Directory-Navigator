[package]
name = "directory-navigator"
version = "1.1.13"
edition = "2021"
description = "Native terminal file manager inspired by DOS Navigator"
authors = ["Dmitry Yarygin"]
license = "MIT"
repository = "https://github.com/deemoun/Directory-Navigator"
readme = "README.md"
keywords = ["file-manager", "terminal", "tui", "dos-navigator", "turbo-vision"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["original-dn/**", "dist/**", "release/**", "dn", "dn.exe"]

# The registry package name differs from the installed command and Rust library.
[lib]
name = "dn"
path = "src/lib.rs"

[[bin]]
name = "dn"
path = "src/main.rs"

[features]
default = ["audio"]
audio = ["dep:rodio", "dep:symphonia-core", "dep:symphonia-metadata"]

[dependencies]
turbo-vision = { version = "=4.1.0", default-features = false }
toml = "1"
crossterm = "0.28"
unicode-segmentation = "1"
unicode-width = "0.2.0"
encoding_rs = "0.8"
netdev = { version = "=0.47.0", default-features = false, features = ["gateway"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
suppaftp = { version = "=12.2.1", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
crc32fast = "1"
pdf-extract = "=0.12.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
zeroize = "1"
pulldown-cmark = { version = "=0.13.6", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate"] }
unrar-rs = { version = "=0.15.3", default-features = false, features = ["crypto-rust"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = { version = "=0.6.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
unicode-normalization = "0.1.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
rodio = { version = "=0.22.2", optional = true, default-features = false, features = ["playback", "mp3", "flac", "wav", "vorbis"] }
symphonia-core = { version = "=0.5.5", optional = true }
symphonia-metadata = { version = "=0.5.5", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress"] }

# Used only by scripts/package_deb.py; does not affect normal Cargo builds.
[package.metadata.deb]
name = "directory-navigator"
copyright = "2026 Dmitry Yarygin"
license-file = ["packaging/debian/copyright", "0"]
depends = "$auto"
suggests = "gpm, openssh-client, xdg-utils"
section = "utils"
priority = "optional"
extended-description = "A terminal file manager with two file panes, movable windows, text editing and viewing, archives, music playback, and remote connections."
assets = [
    ["target/release/dn", "usr/bin/dn", "755"],
    ["README.md", "usr/share/doc/directory-navigator/README.md", "644"],
    ["README.ru.md", "usr/share/doc/directory-navigator/README.ru.md", "644"],
    ["docs/USER_GUIDE.md", "usr/share/doc/directory-navigator/USER_GUIDE.md", "644"],
    ["LICENSE", "usr/share/doc/directory-navigator/LICENSE", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/directory-navigator/THIRD_PARTY_NOTICES.md", "644"],
    ["packaging/debian/dn.1", "usr/share/man/man1/dn.1", "644"],
    ["target/debian/.metadata/changelog.Debian.gz", "usr/share/doc/directory-navigator/changelog.Debian.gz", "644"],
]
