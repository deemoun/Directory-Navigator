[package]
name = "dn"
version = "1.0.0-beta"
edition = "2021"
description = "Native terminal file manager inspired by DOS Navigator 1.51"
authors = ["Dmitry Yarygin"]
license = "MIT"
readme = "README.md"
exclude = ["original-dn/**", "dist/**", "release/**", "dn", "dn.exe"]

[dependencies]
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust.git", rev = "0f2b396a1844c59e31c4714d68ffb6815662918e", default-features = false }
toml = "1"
crossterm = "0.28"
unicode-segmentation = "1"
unicode-width = "0.2.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

