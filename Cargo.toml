[package]
name = "directory-navigator"
version = "1.1.5"
edition = "2021"
description = "Native terminal file manager inspired by DOS Navigator 1.51"
authors = ["Dmitry Yarygin"]
license = "MIT"
repository = "https://github.com/deemoun/Directory-Navigator"
readme = "README.md"
keywords = ["file-manager", "terminal", "tui", "dos-navigator", "turbo-vision"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["original-dn/**", "dist/**", "release/**", "dn", "dn.exe"]

# The registry package name differs from the installed command and Rust library.
[lib]
name = "dn"
path = "src/lib.rs"

[[bin]]
name = "dn"
path = "src/main.rs"

[dependencies]
turbo-vision = { version = "=4.1.0", default-features = false }
toml = "1"
crossterm = "0.28"
unicode-segmentation = "1"
unicode-width = "0.2.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
zeroize = "1"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp3", "flac", "wav", "vorbis"] }
symphonia-core = "=0.5.5"
symphonia-metadata = "=0.5.5"
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

