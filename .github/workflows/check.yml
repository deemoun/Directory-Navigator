name: Rust checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test without audio
        run: cargo test --locked --no-default-features --test mp3_player --test plugin_settings
      - name: Check optional acoustic support
        run: cargo clippy --locked --all-targets --features acoustic -- -D warnings
      - name: Test acoustic protocol without audio hardware
        run: cargo test --locked --features acoustic --lib acoustic
      - name: Test experimental plugin settings and UI
        run: cargo test --locked --features acoustic --test experimental_plugins --test ui_refactor_parity
      - name: Check acoustic support without music playback
        run: cargo check --locked --no-default-features --features acoustic
      - run: cargo build --release --locked
