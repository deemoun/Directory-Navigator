name: Build Linux
run-name: Linux Directory Navigator ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without v (for example 1.0.0 or 1.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.repository }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Set build version
        run: python3 scripts/release.py prepare "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify version and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py package "$RELEASE_VERSION" --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: dist/dn-*
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Verify Linux downloads
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Verify complete Linux assets
        run: python3 scripts/release.py verify-assets "$RELEASE_VERSION" --platform linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-downloads
          path: dist/*
          if-no-files-found: error
          retention-days: 30
